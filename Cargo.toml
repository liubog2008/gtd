[package]
name = "gtd"
version = "0.1.0"
edition = "2024"
description = "A pragmatic GTD task manager with a CLI, TUI, HTTP server, and SQLite storage"
license = "MIT"

[[bin]]
name = "gtd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
diesel = { version = "2.3", features = ["chrono", "r2d2", "sqlite"] }
diesel_migrations = "2.3"
futures-core = "0.3"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.22"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
